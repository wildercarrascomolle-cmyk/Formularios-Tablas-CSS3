<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con estilos CSS</title>
    <link rel="stylesheet" type="text/css" href="estilos.css" />
</head>
<body>
<div class="contenedor">
    <div class="contenedor-logo">
        <img src="floreria.jpg" width="200" height="200" alt="Logotipo de floreria Amarilis">
    </div>
    <h1>FORMULARIO DE CAPTURA DE DATOS</h1>
    <h2>NUEVO PEDIDO</h2>
    <form>
        <div class="cuadro-azul">
            <table>
                <tr>
                    <td>Nombre: </td>
                    <td><input type="text" name="nombre" class="dato"></td>
                </tr>
                <tr>
                    <td>Apellidos: </td>
                    <td><input type="text" name="apellidos" class="dato"></td>
                </tr>
                <tr>
                    <td>Dirección: </td>
                    <td><input type="text" name="direccion" class="dato"></td>
                </tr>
            </table>
        </div>
        <div class="cuadro-azul">
            <p>Número de tarjeta de crédito</p>
            <p><input type="text" name="tarjeta" class="dato"></p>
            <p><input type="radio" name="banco" value="BCP"> BCP</p>
            <p><input type="radio" name="banco" value="Interbank"> Interbank</p>
            <p><input type="radio" name="banco" value="BBVA"> BBVA</p>
            <p><input type="radio" name="banco" value="Scotiabank"> Scotiabank</p>
        </div>
        <div class="contenedor-enviar">
            <input type="submit" value="Realizar pedido">
        </div>
    </form>
    <div class="pie">
        <p>Copyright 2026 - Derechos reservados Florería Amarilis</p>
        <p>Programador: (Wilder Elias Carrasco Molle)</p>
    </div>
</div>
</body>
</html>
