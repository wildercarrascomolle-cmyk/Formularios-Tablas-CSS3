<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario combinado con una tabla</title>
</head>
<body>
    <h1>Uso de una tabla para alinear un formulario</h1>
    <hr>
    <p><b>Programado por: </b>(Wilder Elias Carrasco Molle)</p>
    <form method="get">
        <!-- border="1" muestra las líneas de la tabla; quítalo para ocultarlas -->
        <table border="1">
            <tr><td>Nombre del alumno: </td>
                <td><input type="text" name="nombre"></td>
            </tr>
            <tr><td>Apellido paterno: </td>
                <td><input type="text" name="apellido_p"></td>
            </tr>
            <tr><td>Apellido materno: </td>
                <td><input type="text" name="apellido_m"></td>
            </tr>
            <tr><td>Correo electrónico: </td>
                <td><input type="email" name="correo"></td>
            </tr>
            <tr><td>Edad: </td>
                <td><input type="number" name="edad" min="10" max="99"></td>
            </tr>
            <tr><td>Institución: </td>
                <td>
                    <select name="institucion">
                        <option value="ist1">IEST Público N.° 1</option>
                        <option value="ist2">IEST Público N.° 2</option>
                        <option value="ist3">IEST Público N.° 3</option>
                    </select>
                </td>
            </tr>
            <tr><td>Distrito: </td>
                <td>
                    <select name="distrito">
                        <option value="Lima">Lima</option>
                        <option value="Miraflores">Miraflores</option>
                        <option value="SJL">San Juan de Lurigancho</option>
                    </select>
                </td>
            </tr>
            <tr><td>Comentarios: </td>
                <td>
                    <textarea cols="20" rows="6" name="comentarios"></textarea>
                </td>
            </tr>
        </table>
        <br>
        <input type="submit" value="Enviar datos" />
    </form>
</body>
</html>
